    <title>Welcome</title>
</head>

<body>
    <div class="Box1">
        Hello there, please insert the correct password to see the content of this page.<br><br>
        <input type="text" id="passwordInput" placeholder="Enter password">
        <button onclick="checkPassword()">Check</button><br>
        <hr>
        <button id="CorrectPassword" type="button" onclick="window.location.href='Bio.html'" hidden>Open content</button>
        <p id="IncorrectPassword" hidden>Incorrect password. Please try again.</p>
        <a class="Greyoka" href="Bio.html">If you're lazy, click here</a>
    </div>
    <button class="ThemeButton" type="button" onclick="toggleTheme()">Dark mode</button>

    <script>
        console.log("You have to insert correct password to see content.");
        // Password: AccessMyBio

        function toggleTheme() {
            document.body.classList.toggle('DarkMode');
            const isDark = document.body.classList.contains('DarkMode');
            localStorage.setItem('darkMode', isDark);
            updateThemeButtons(isDark);
        }

        function updateThemeButtons(isDark) {
            document.querySelectorAll('.ThemeButton').forEach(function (button) {
                button.textContent = isDark ? 'Light mode' : 'Dark mode';
            });
        }

        const savedDarkMode = localStorage.getItem('darkMode') === 'true';
        document.body.classList.toggle('DarkMode', savedDarkMode);
        updateThemeButtons(savedDarkMode);

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === 'AccessMyBio') {
                document.getElementById('CorrectPassword').hidden = false;
                document.getElementById('IncorrectPassword').hidden = true;
                document.getElementById('passwordInput').value = '';
            } else {
                document.getElementById('IncorrectPassword').hidden = false;
                document.getElementById('CorrectPassword').hidden = true;
                document.getElementById('passwordInput').value = '';
            }
        }
    </script>
</body>

</html>
